name: Check bc.panda-il.com (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require SSH connection settings
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          USER: ${{ secrets.VPS1_USER }}
          KEY: ${{ secrets.VPS1_SSH_KEY }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN" || {
            echo "Missing VPS1_HOST / VPS1_USER / VPS1_SSH_KEY / VPS1_KNOWN_HOSTS secret"
            exit 1
          }
      - name: Configure SSH securely
        env:
          KEY: ${{ secrets.VPS1_SSH_KEY }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect hostname reservation (no changes)
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          USER: ${{ secrets.VPS1_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 "$USER@$HOST" 'sh -s' <<'REMOTE'
          echo "=== Server ==="
          hostname
          echo "=== Web directory matches ==="
          find /home -maxdepth 4 -type d -name 'bc.panda-il.com' -print 2>/dev/null || true
          echo "=== Web config references (accessible files only) ==="
          grep -RIlFs 'bc.panda-il.com' /etc/nginx /etc/apache2 /home/*/conf/web 2>/dev/null | head -30 || true
          echo "=== DNS A records ==="
          if command -v dig >/dev/null 2>&1; then dig +short bc.panda-il.com A; else getent ahostsv4 bc.panda-il.com | head -3 || true; fi
          echo "=== Completed: read-only check; absent output is not proof of availability ==="
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
