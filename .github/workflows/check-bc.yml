name: Check bc.panda-il.com (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate connection settings
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          SSH_USER: ${{ secrets.VPS1_USER }}
          SSH_KEY_B64: ${{ secrets.VPS1_SSH_KEY_B64 }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          if [[ -z "$HOST" || -z "$SSH_USER" || -z "$SSH_KEY_B64" || -z "$KNOWN" ]]; then
            echo "::error::Missing VPS1_HOST, VPS1_USER, VPS1_SSH_KEY_B64, or VPS1_KNOWN_HOSTS"
            exit 1
          fi
      - name: Configure and validate SSH key
        env:
          SSH_KEY_B64: ${{ secrets.VPS1_SSH_KEY_B64 }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          if ! printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519; then
            echo "::error::SSH key secret is not valid base64"
            exit 1
          fi
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::Decoded SSH private key is invalid or encrypted; check VPS1_SSH_KEY_B64"
            exit 1
          fi
          echo "SSH key format validated"
      - name: Inspect hostname reservation (no changes)
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          SSH_USER: ${{ secrets.VPS1_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 "$SSH_USER@$HOST" 'sh -s' <<'REMOTE'
          echo "=== Server ==="
          hostname
          echo "=== Web directory matches ==="
          find /home -maxdepth 4 -type d -name 'bc.panda-il.com' -print 2>/dev/null || true
          echo "=== Web config references (accessible files only) ==="
          grep -RIlFs 'bc.panda-il.com' /etc/nginx /etc/apache2 /home/*/conf/web 2>/dev/null | head -30 || true
          echo "=== DNS A records ==="
          if command -v dig >/dev/null 2>&1; then dig +short bc.panda-il.com A; else getent ahostsv4 bc.panda-il.com | head -3 || true; fi
          echo "=== Completed: read-only check; absent output is not proof of availability ==="
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
