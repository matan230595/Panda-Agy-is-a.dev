name: Check bc.panda-il.com (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate connection settings
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          SSH_USER: ${{ secrets.VPS1_USER }}
          SSH_KEY_B64: ${{ secrets.VPS1_SSH_KEY_B64 }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          if [[ -z "$HOST" || -z "$SSH_USER" || -z "$SSH_KEY_B64" || -z "$KNOWN" ]]; then
            echo "::error::Missing required VPS1 connection secret"
            exit 1
          fi
      - name: Configure and validate SSH key
        env:
          SSH_KEY_B64: ${{ secrets.VPS1_SSH_KEY_B64 }}
          KNOWN: ${{ secrets.VPS1_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null
          echo "RESULT: SSH_KEY_VALID"
      - name: Inspect Hestia reservation and DNS
        env:
          HOST: ${{ secrets.VPS1_HOST }}
          SSH_USER: ${{ secrets.VPS1_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$HOST" 'sh -se' <<'REMOTE'
          echo "=== Server ==="
          hostname
          echo "=== Hestia registration ==="
          sudo -n /usr/local/sbin/panda-check-bc-domain
          echo "=== DNS verification ==="
          if ! command -v dig >/dev/null 2>&1; then
            echo "ERROR: dig unavailable"
            exit 1
          fi
          answers="$(dig +short bc.panda-il.com A)"
          if [ "$answers" != "164.68.109.11" ]; then
            echo "ERROR: DNS_A_NOT_EXACTLY_VPS1"
            exit 1
          fi
          echo "RESULT: DNS_POINTS_TO_VPS1"
          REMOTE
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
